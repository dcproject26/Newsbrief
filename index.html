<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="NewsBrief — Verified news, no noise."/>
<title>NewsBrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#fafaf9;--surface:#fff;--surface2:#f4f3f0;--surface3:#eceae5;
  --border:#e4e2dc;--border2:#ccc9c0;
  --ink:#111110;--ink2:#3d3c39;--ink3:#79776e;--ink4:#a8a59c;--ink5:#c8c5bc;
  --accent:#c0392b;--accent-pale:rgba(192,57,43,.08);--accent-mid:rgba(192,57,43,.15);
  --green:#1a6b3c;--green-pale:rgba(26,107,60,.08);
  --red:#c0392b;--red-pale:rgba(192,57,43,.07);
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"DM Sans",system-ui,sans-serif;
  --r:8px;--r-sm:5px;--r-xs:3px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --sh-lg:0 2px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.08);
  --hdr-h:52px;--nav-h:40px;
}
[data-theme="dark"]{
  --bg:#0d0d0c;--surface:#161614;--surface2:#1e1e1b;--surface3:#262622;
  --border:#2a2a26;--border2:#363630;
  --ink:#f0ede6;--ink2:#b5b2a8;--ink3:#737069;--ink4:#4a4843;--ink5:#333230;
  --accent:#e05240;--accent-pale:rgba(224,82,64,.09);--accent-mid:rgba(224,82,64,.18);
  --green:#2d9e5f;--green-pale:rgba(45,158,95,.09);
  --red:#e05240;--red-pale:rgba(224,82,64,.08);
  --sh:0 1px 2px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.2);
  --sh-lg:0 2px 12px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .2s,color .2s}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* HEADER */
.hdr{height:var(--hdr-h);background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300;display:flex;align-items:center}
.hdr-inner{width:100%;max-width:760px;margin:0 auto;padding:0 1.25rem;display:flex;align-items:center;gap:0}
.logo{font-family:var(--serif);font-size:1.35rem;font-weight:400;font-style:italic;letter-spacing:-.01em;color:var(--ink);flex:1;line-height:1}
.logo b{font-style:normal;font-weight:400;color:var(--accent)}
.hdr-btns{display:flex;align-items:center;gap:2px}
.hbtn{width:34px;height:34px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink3);transition:background .12s,color .12s;position:relative}
.hbtn:hover{background:var(--surface2);color:var(--ink)}
.hbtn.active{color:var(--accent)}
.hbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.badge-count{position:absolute;top:4px;right:3px;min-width:14px;height:14px;padding:0 3px;background:var(--accent);color:#fff;border-radius:99px;font-size:.5rem;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1}

/* TICKER */
.ticker{background:var(--surface);border-bottom:1px solid var(--border);overflow:hidden;padding:.28rem 0;display:flex;align-items:center}
.ticker-lbl{flex-shrink:0;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:0 .85rem;border-right:1px solid var(--border2)}
.ticker-outer{overflow:hidden;flex:1;cursor:pointer}
.ticker-track{display:flex;align-items:center;gap:0;animation:ticker-scroll 40s linear infinite;white-space:nowrap;width:max-content}
.ticker-track:hover{animation-play-state:paused}
.t-item{display:inline-flex;align-items:center;gap:.4rem;padding:0 1.5rem 0 0;font-size:.72rem;cursor:pointer;transition:opacity .15s}
.t-item:hover{opacity:.7}
.t-cat{font-size:.58rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.t-sep{color:var(--border2);flex-shrink:0}
.t-headline{color:var(--ink2);font-weight:500}
.t-placeholder{font-size:.72rem;color:var(--ink3);padding:0 1rem}
@keyframes ticker-scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* CAT NAV */
.cat-nav{height:var(--nav-h);background:var(--bg);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--hdr-h);z-index:299;display:flex;align-items:stretch}
.cat-nav::-webkit-scrollbar{display:none}
.cat-nav-inner{max-width:760px;margin:0 auto;width:100%;display:flex;padding:0 .5rem}
.cat-btn{padding:0 .75rem;font-size:.75rem;font-weight:500;letter-spacing:.01em;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:.3rem;transition:color .12s,border-color .12s}
.cat-btn:hover{color:var(--ink2)}
.cat-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cat-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .2s;flex-shrink:0}
.cat-btn.loaded .cat-dot{opacity:1}

/* MANAGE PANEL */
.manage-panel{background:var(--surface);position:fixed;top:0;left:0;right:0;z-index:500;transform:translateY(-110%);transition:transform .28s cubic-bezier(.16,1,.3,1);border-bottom:1px solid var(--border2);box-shadow:var(--sh-lg);max-height:85vh;overflow-y:auto}
.manage-panel.open{transform:translateY(0)}
.manage-inner{max-width:760px;margin:0 auto;padding:1.25rem}
.manage-inner h3{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.85rem}
.manage-grid{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.85rem}
.mcat-chip{display:flex;align-items:center;gap:.35rem;padding:.35rem .65rem;border-radius:99px;border:1px solid var(--border2);font-size:.73rem;font-weight:500;color:var(--ink2);transition:all .12s;cursor:pointer}
.mcat-chip:hover{border-color:var(--ink3);color:var(--ink)}
.mcat-chip.pinned{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mcat-chip:not(.pinned){opacity:.6}
.chip-ico{font-size:.75rem}
.manage-actions{display:flex;gap:.5rem}
.manage-btn{padding:.35rem .8rem;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:.72rem;font-weight:500;color:var(--ink2);transition:all .12s;cursor:pointer}
.manage-btn:hover{border-color:var(--ink3);color:var(--ink)}
.manage-hint{font-size:.68rem;color:var(--ink3);margin-top:.6rem;line-height:1.5}

/* BOOKMARK PANEL */
.bm-panel{background:var(--surface);position:fixed;top:0;left:0;right:0;z-index:500;transform:translateY(-110%);transition:transform .28s cubic-bezier(.16,1,.3,1);border-bottom:1px solid var(--border2);box-shadow:var(--sh-lg);max-height:85vh;overflow-y:auto}
.bm-panel.open{transform:translateY(0)}
.bm-inner{max-width:760px;margin:0 auto;padding:1.25rem}
.bm-inner h3{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.85rem;display:flex;align-items:center;gap:.75rem}
.bm-empty{font-size:.85rem;color:var(--ink3);padding:1.5rem 0;text-align:center;line-height:1.6}
.bm-item{padding:.85rem 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.35rem}
.bm-item:last-child{border-bottom:none}
.bm-item-title{font-family:var(--serif);font-size:.95rem;color:var(--ink);line-height:1.35}
.bm-item-meta{display:flex;align-items:center;gap:.5rem}
.bm-item-src{font-size:.65rem;font-weight:600;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.bm-item-time{font-size:.63rem;color:var(--ink4)}
.bm-item-actions{display:flex;gap:.35rem;margin-top:.1rem}
.bm-read{font-size:.72rem;font-weight:500;color:var(--ink);padding:.28rem .65rem;border:1px solid var(--border2);border-radius:var(--r-sm);transition:all .12s}
.bm-read:hover{border-color:var(--accent);color:var(--accent)}
.bm-remove{font-size:.72rem;color:var(--ink3);padding:.28rem .65rem;border:1px solid var(--border);border-radius:var(--r-sm);transition:all .12s;cursor:pointer}
.bm-remove:hover{border-color:var(--red);color:var(--red)}
.bm-clear{padding:.28rem .65rem;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:.68rem;font-weight:500;color:var(--ink3);transition:all .12s;margin-left:auto;cursor:pointer}
.bm-clear:hover{border-color:var(--red);color:var(--red)}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499;display:none;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* SEARCH BAR */
.search-bar{max-width:760px;margin:0 auto;padding:.6rem 1.25rem .2rem;display:none}
.search-bar.show{display:block}
.search-input{width:100%;padding:.55rem .85rem;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface2);color:var(--ink);font-family:var(--sans);font-size:.88rem;outline:none;transition:border-color .15s,background .15s}
.search-input:focus{border-color:var(--ink3);background:var(--surface)}
.search-input::placeholder{color:var(--ink4)}

/* TYPE FILTER */
.type-bar{max-width:760px;margin:0 auto;padding:.5rem 1.25rem .15rem;display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;min-height:1px}
.type-lbl{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4);margin-right:.15rem}
.tchip{padding:.22rem .55rem;border:1px solid var(--border2);border-radius:99px;font-size:.68rem;font-weight:500;color:var(--ink3);transition:all .12s;cursor:pointer}
.tchip:hover{border-color:var(--ink3);color:var(--ink2)}
.tchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}



/* MAIN + SECTION HEAD */
.main{max-width:760px;margin:0 auto;padding:.75rem 1.25rem 5rem}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;padding-bottom:.55rem;border-bottom:2px solid var(--ink)}
.sec-title{font-family:var(--serif);font-size:1.4rem;font-weight:700;color:var(--ink)}
.sec-actions{display:flex;align-items:center;gap:.5rem}
.sec-meta{font-size:.7rem;color:var(--ink3)}
.ref-btn{padding:.28rem .65rem;background:transparent;border:1px solid var(--border2);border-radius:var(--r-sm);font-family:var(--sans);font-size:.7rem;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:.3rem;transition:all .12s}
.ref-btn:hover{color:var(--accent);border-color:var(--accent)}
.ref-btn:disabled{opacity:.35;pointer-events:none}

/* STATES */
.state-box{padding:3rem 1rem;text-align:center;color:var(--ink3)}
.spin-ring{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .85rem}
@keyframes spin{to{transform:rotate(360deg)}}
.state-box p{font-size:.85rem;line-height:1.55;margin-top:.35rem}
.retry-btn{margin-top:.85rem;padding:.38rem .9rem;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:.75rem;font-weight:500;color:var(--ink2);transition:all .12s;cursor:pointer}
.retry-btn:hover{border-color:var(--accent);color:var(--accent)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.45rem;overflow:hidden;transition:border-color .2s,box-shadow .2s;cursor:pointer}
.card:hover,.card.open{border-color:var(--border2)}
.card.open{box-shadow:var(--sh-lg)}
.card-head{padding:1rem 1.1rem .9rem;user-select:none}
.card-top{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem}
.src-name{font-size:.67rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.src-dot{width:2px;height:2px;border-radius:50%;background:var(--border2);flex-shrink:0}
.read-time{font-size:.67rem;color:var(--ink4)}
.card-ago{font-size:.67rem;color:var(--ink4);margin-left:auto;white-space:nowrap}
.card-title{font-family:var(--sans);font-size:1rem;font-weight:600;line-height:1.38;color:var(--ink);margin-bottom:.42rem;letter-spacing:-.015em}
.card-snip{font-size:.875rem;line-height:1.65;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* CARD BODY — smooth expand */
.card-body{max-height:0;overflow:hidden;padding:0 1.1rem;display:flex;flex-direction:column;gap:.75rem;transition:max-height .25s ease,padding .25s ease,border-top-width .25s ease;border-top:0px solid var(--border)}
.card.open .card-body{max-height:600px;border-top-width:1px;padding:.85rem 1.1rem .9rem}
.card-full{font-size:.9rem;line-height:1.75;color:var(--ink2)}
.card-full p{margin-bottom:.6rem}
.card-full p:last-child{margin-bottom:0}
.card-btns{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn-read{display:inline-flex;align-items:center;gap:.3rem;padding:.42rem .9rem;background:var(--accent);border-radius:var(--r-sm);font-size:.75rem;font-weight:600;color:#fff;text-decoration:none;transition:opacity .12s}
.btn-read:hover{opacity:.88}
.btn-share{display:inline-flex;align-items:center;gap:.3rem;padding:.42rem .9rem;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:.75rem;font-weight:500;color:var(--ink2);transition:all .12s;cursor:pointer}
.btn-share:hover{border-color:var(--ink3);color:var(--ink)}
.bm-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.42rem .9rem;border:1px solid var(--border2);border-radius:var(--r-sm);font-size:.75rem;font-weight:500;color:var(--ink2);transition:all .12s;margin-left:auto;cursor:pointer}
.bm-btn:hover{border-color:var(--ink3);color:var(--ink)}
.bm-btn.saved{background:var(--accent-pale);border-color:var(--accent-mid);color:var(--accent)}
.bm-btn::after{content:"Save"}
.bm-btn.saved::after{content:"Saved ✓"}
.ctag{font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.14rem .4rem;border-radius:var(--r-xs);background:var(--accent-pale);color:var(--accent)}

/* LOAD MORE */
.load-more{display:block;width:100%;padding:.6rem;margin-top:.25rem;border:1px solid var(--border2);border-radius:var(--r);font-size:.78rem;font-weight:500;color:var(--ink3);background:transparent;text-align:center;transition:all .12s;cursor:pointer}
.load-more:hover{border-color:var(--ink3);color:var(--ink)}
.src-row{max-width:760px;margin:0 auto;padding:.3rem 1.25rem .1rem;display:flex;gap:.25rem;flex-wrap:wrap;min-height:1px}
.sc{font-size:.6rem;font-weight:600;padding:.1rem .35rem;border-radius:var(--r-xs);letter-spacing:.04em;text-transform:uppercase}
.sc.ok{background:var(--green-pale);color:var(--green)}
.sc.fail{background:var(--red-pale);color:var(--red);text-decoration:line-through;opacity:.55}
.sc.wait{background:var(--surface3);color:var(--ink4)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fi .2s ease}
.modal-bg.hidden{display:none}
@keyframes fi{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r);max-width:660px;width:100%;max-height:88vh;overflow-y:auto;padding:1.75rem;position:relative;animation:su .25s cubic-bezier(.16,1,.3,1);box-shadow:var(--sh-lg)}
@keyframes su{from{opacity:0;transform:translateY(18px)}}
.mcls{position:absolute;top:.85rem;right:.85rem;width:28px;height:28px;border:1px solid var(--border2);background:transparent;border-radius:50%;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);transition:all .12s}
.mcls:hover{background:var(--surface2)}
.msrc{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem}
.mtitle{font-family:var(--serif);font-size:1.35rem;font-weight:700;line-height:1.3;margin-bottom:.75rem;color:var(--ink)}
.mrule{width:2rem;height:2px;background:var(--accent);margin-bottom:1rem}
.mbody{font-size:.9rem;line-height:1.72;color:var(--ink2)}
.mbody p{margin-bottom:.75rem}
.mfoot{margin-top:1.2rem;padding-top:.85rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}

/* TOAST */
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.45rem 1rem;border-radius:99px;font-size:.75rem;font-weight:500;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:t-in .18s ease}
.toast.hidden{display:none}
@keyframes t-in{from{opacity:0;transform:translateX(-50%) translateY(5px)}}

/* MOBILE */
@media(max-width:600px){
  :root{--hdr-h:48px;--nav-h:38px}
  .logo{font-size:1.15rem}
  .hbtn{width:36px;height:36px}
  .cat-btn{padding:0 .55rem;font-size:.71rem}
  .main{padding:.6rem .85rem 5rem}
  .type-bar,.src-row,.search-bar{padding-left:.85rem;padding-right:.85rem}
  .card-head{padding:.9rem .9rem .85rem}
  .card-title{font-size:.97rem}
  .card-snip{font-size:.84rem}
  .card.open .card-body{padding:.8rem .9rem .9rem}
  .card-full{font-size:.875rem}
  .btn-read,.btn-share,.bm-btn{padding:.5rem 1rem;font-size:.8rem}
  .manage-inner,.bm-inner{padding:.85rem}
  .manage-panel,.bm-panel{max-height:90vh}
  .src-row{display:none}
  .type-bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:.35rem}
  .type-bar::-webkit-scrollbar{display:none}
}
@media(min-width:601px) and (max-width:768px){
  .main,.type-bar,.src-row,.search-bar{padding-left:1rem;padding-right:1rem}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="logo">News<b>Brief</b></div>
    <div class="hdr-btns">
      <button class="hbtn" id="btn-search" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="hbtn" id="btn-bookmarks" title="Bookmarks" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="badge-count" id="bm-count"></span>
      </button>
      <button class="hbtn" id="btn-manage" title="Manage categories" aria-label="Manage categories">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <button class="hbtn" id="btn-refresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" id="ref-svg"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
      </button>
      <button class="hbtn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" id="theme-svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="ticker">
  <div class="ticker-lbl">Live</div>
  <div class="ticker-outer">
    <div class="ticker-track" id="ticker-track">
      <span class="t-placeholder">Loading headlines across all categories…</span>
    </div>
  </div>
</div>

<nav class="cat-nav">
  <div class="cat-nav-inner" id="cat-nav"></div>
</nav>

<div class="manage-panel" id="manage-panel">
  <div class="manage-inner">
    <h3>Manage categories</h3>
    <div class="manage-grid" id="manage-grid"></div>
    <div class="manage-actions">
      <button class="manage-btn" id="btn-reset-cats">Reset to default</button>
    </div>
    <p class="manage-hint">Tap to <strong>add</strong> or <strong>remove</strong> categories from your nav bar.</p>
  </div>
</div>

<div class="bm-panel" id="bm-panel">
  <div class="bm-inner">
    <h3>Bookmarks <button class="bm-clear" id="bm-clear-all">Clear all</button></h3>
    <div id="bm-list"></div>
  </div>

function timeAgo(d){
  if(!d) return '';
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(isNaN(s)||s<0) return '';
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function readTime(text){
  const words=(text||'').trim().split(/\s+/).filter(Boolean).length;
  const mins=Math.max(1,Math.round(words/200));
  return mins===1?'1 min read':`${mins} min read`;
}

/* ── Google News helper ── */
function extractGoogleNewsRelated(htmlDesc){
  // Google News description HTML has <li><a>Headline — Source</a></li> items
  // We extract the SOURCE NAMES from items 2-4 for context
  const tmp=document.createElement('div');
  tmp.innerHTML=htmlDesc||'';
  const anchors=Array.from(tmp.querySelectorAll('li a'));
  if(anchors.length<=1) return '';
  const sources=anchors.slice(1,5).map(a=>{
    const txt=(a.textContent||'').trim();
    // Split on dash variants: " - ", " – ", " — "
    const m=txt.match(/[–—-]\s*([^–—-]{2,35})\s*$/);
    return m?m[1].trim():'';
  }).filter(s=>s.length>2);
  if(!sources.length) return '';
  return 'Also covered: '+[...new Set(sources)].join(' · ');
}

/* ── content utils ── */

// Split into sentences on ". Capital" boundaries
function sentences(text){
  return text.split(/(?<=[.!?])\s+(?=[A-Z])/).map(s=>s.trim()).filter(s=>s.length>20);
}

// Normalise for comparison: lowercase, strip source attributions and punctuation
function normalise(s){
  return s.toLowerCase()
    .replace(/\s*[-–—]\s*(reuters|bbc|ap|afp|guardian|bloomberg|cnn|hindu|al\s*jazeera)\s*$/i,'')
    .replace(/,\s*official\s+says?\s*$/i,'')
    .replace(/,\s*sources?\s+say\s*$/i,'')
    .replace(/[^a-z0-9\s]/g,'')
    .replace(/\s+/g,' ').trim();
}

// True only if sentence is an exact/near-exact repeat of the title
function isRepeat(title, s){
  const nt=normalise(title), ns=normalise(s);
  if(nt===ns) return true;
  if(nt.length>10 && ns.includes(nt) && ns.length-nt.length<20) return true;
  if(ns.length>10 && nt.includes(ns) && nt.length-ns.length<15) return true;
  return false;
}

// COLLAPSED: first sentence of description that isn't the title verbatim
function buildSnippet(title, raw){
  const text=strip(raw).trim();
  if(!text) return '';
  const ss=sentences(text);
  if(!ss.length){
    return !isRepeat(title,text) ? text.slice(0,160)+(text.length>160?'…':'') : '';
  }
  for(const s of ss.slice(0,6)){
    if(!isRepeat(title,s) && s.length>25)
      return s.slice(0,170)+(s.length>170?'…':'');
  }
  return '';
}

// EXPANDED: all remaining sentences that aren't the title or the snippet
function buildFull(title, raw, snippet){
  const text=strip(raw).trim();
  if(!text) return '';
  const ss=sentences(text);
  if(!ss.length) return '';
  // Core of snippet (strip trailing ellipsis) for truncation detection
  const snipCore=(snippet||'').replace(/…$/, '').trim().slice(0,80);
  const kept=[]; let chars=0;
  for(const s of ss){
    if(isRepeat(title,s)) continue;
    if(snippet && s.trim()===snippet.trim()) continue;
    // If sentence STARTS WITH the snippet (handles truncated snippets showing full sentence)
    if(snipCore.length>40 && s.startsWith(snipCore)) continue;
    if(s.length<20) continue;
    kept.push(s); chars+=s.length;
    if(chars>420) break;
  }
  const result=kept.join(' ');
  return result.slice(0,420)+(result.length>420?'…':'');
}

/* ══════════════════════════════════════════
   FETCH
══════════════════════════════════════════ */
async function rss_r2j(url,n){
  const r=await go(R2J+encodeURIComponent(url),{},4000); // 4s max for rss2json
  if(!r.ok) throw new Error('r2j:'+r.status);
  const j=await r.json();
  if(j.status!=='ok') throw new Error('r2j:'+j.status); // fast-fail on rate limit
  return (j.items||[]).filter(i=>i.title).map(i=>{
    const rawTitle=strip(i.title);
    const isGoogleNews=n.toLowerCase().includes('google');
    // Clean Google News titles: strip trailing " - Source Name"
    const t=isGoogleNews?rawTitle.replace(/\s[\u2013\u2014-]\s[^\u2013\u2014-]{2,40}$/, '').trim():rawTitle;
    const rawDesc=i.description||i.content||'';
    let snippet='', full='';
    if(isGoogleNews){
      // Extract related story headlines from Google News HTML description
      const related=extractGoogleNewsRelated(rawDesc);
      snippet=''; // title IS the story
      full=related; // "Also covered by: X, Y, Z"
    } else {
      const raw=strip(rawDesc).trim();
      snippet=buildSnippet(t,raw);
      full=buildFull(t,raw,snippet);
    }
    return{title:t,url:i.link||i.guid||'#',snippet,full,source:n,date:i.pubDate||'',type:'rss'};
  });
}

async function rss_proxy(url,n,base){
  const r=await go(base+encodeURIComponent(url));
  if(!r.ok) throw new Error('p:'+r.status);
  const txt=base===AO?(await r.json()).contents:await r.text();
  const xml=new DOMParser().parseFromString(txt,'text/xml');
  if(xml.querySelector('parsererror')) throw new Error('xml');
  return Array.from(xml.querySelectorAll('item,entry')).slice(0,25).map(i=>{
    const g=t=>i.querySelector(t)?.textContent?.trim()||''
    const gl=t=>i.querySelector(t)?.getAttribute('href')||''
    const link=(g('link')||gl('link')||g('guid')||'#').trim();
    const desc=g('description')||g('summary')||g('content')||'';
    const title=strip(g('title'));
    if(!title) return null;
    const isGN=n.toLowerCase().includes('google');
    const rawDescP=isGN?(i.querySelector('description')?.innerHTML||desc):desc;
    let snipP='',fullP='';
    if(isGN){
      snipP='';
      fullP=extractGoogleNewsRelated(rawDescP);
    } else {
      snipP=buildSnippet(title,desc);
      fullP=buildFull(title,desc,snipP);
    }
    return{title:isGN?title.replace(/\s[\u2013\u2014-]\s[^\u2013\u2014-]{2,40}$/,'').trim():title,
      url:link,snippet:snipP,full:fullP,
      source:n,date:g('pubDate')||g('published')||g('updated')||'',type:'rss'};
  }).filter(Boolean);
}

async function fetchRSS(url,n){
  const tryFn = async fn => { try{ const r=await fn(); return (r&&r.length)?r:null; }catch{ return null; } };

  // 1. rss2json first — fastest CDN, 4s timeout
  const r2j = await tryFn(()=>rss_r2j(url,n));
  if(r2j) return r2j;

  // 2. Race allorigins vs corsproxy — fire both, use whichever returns data first
  const winner = await new Promise(resolve=>{
    let pending=2, done=false;
    const finish = v => {
      if(done) return;
      if(v){ done=true; resolve(v); return; }
      if(--pending===0){ done=true; resolve(null); } // both failed
    };
    tryFn(()=>rss_proxy(url,n,AO)).then(finish);
    tryFn(()=>rss_proxy(url,n,COR)).then(finish);
  });
  if(winner) return winner;
  console.warn('RSS fail:',n); return null;
}

async function fetchHN(){
  const ids=await go(HN_T,{},4000).then(r=>r.json());
  const hits=await Promise.allSettled(ids.slice(0,15).map(id=>go(HN_I(id),{},3000).then(r=>r.json())));
  return hits.filter(r=>r.status==='fulfilled'&&r.value?.title).map(r=>r.value).map(i=>({
    title:i.title,url:i.url||`https://news.ycombinator.com/item?id=${i.id}`,
    snippet:buildSnippet(i.title,''),full:'',source:'Hacker News',
    score:i.score,date:i.time?new Date(i.time*1000).toISOString():'',type:'hn'
  }));
}

let _refreshTimer=null;
async function loadCat(id,force=false,silent=false){
  const cat=ALL_CATS.find(c=>c.id===id);
  if(!cat){ console.warn('loadCat: unknown id',id); return; }
  const ttlMs=cat.ttl*60000;
  if(!force&&CACHE[id]&&Date.now()-CACHE[id].ts<ttlMs){
    if(!silent){
      const sr=$("src-row"); if(sr) sr.innerHTML=''; // clear stale source status
      curItems=CACHE[id].items;activeTypes.clear();visCount=PG;
      renderTypeBar();renderFeed();scheduleRefresh(id,ttlMs);
    }
    return;
  }
  if(!silent){showLoading();renderSrcRow(cat.sources.map(s=>s.n),'wait',{});}
  const tasks=cat.sources.map(async s=>{
    try{
      let items=null;
      if(s.t==='rss') items=await fetchRSS(s.url,s.n);
      else if(s.t==='hn') items=await fetchHN();
      return{n:s.n,items:items||[]};
    }catch(e){console.warn(s.n,e.message);return{n:s.n,items:[]};}
  });
  const results=await Promise.allSettled(tasks);
  const sm={};let items=[];
  results.forEach(r=>{
    if(r.status==='fulfilled'){const{n,items:its}=r.value;sm[n]=its.length?'ok':'fail';items.push(...its.map(i=>({...i,srcName:n})));}
  });

  const seen=new Set();
  items=items.filter(i=>{const k=i.title.slice(0,60).toLowerCase().replace(/\W+/g,'');if(seen.has(k))return false;seen.add(k);return true;});
  items.sort((a,b)=>{const va=new Date(a.date).getTime()||0,vb=new Date(b.date).getTime()||0;if(va&&vb)return vb-va;if(va)return -1;if(vb)return 1;return(b.score||0)-(a.score||0);});
  if(!items.length){if(!silent)showEmpty(id);return;}
  CACHE[id]={ts:Date.now(),items};
  document.querySelectorAll('.cat-btn').forEach(b=>{if(b.dataset.cat===id)b.classList.add('loaded');});
  if(!silent) renderSrcRow(cat.sources.map(s=>s.n),null,sm);
  updateTicker();
  if(!silent){curItems=items;activeTypes.clear();visCount=PG;renderTypeBar();renderFeed();scheduleRefresh(id,ttlMs);}
  else if(id===activeCat){curItems=items;activeTypes.clear();visCount=PG;renderTypeBar();renderFeed();scheduleRefresh(id,ttlMs);}
}

function scheduleRefresh(id,ttlMs){
  clearTimeout(_refreshTimer);
  _refreshTimer=setTimeout(()=>{if(activeCat===id){delete CACHE[id];loadCat(id,true);toast('Auto-refreshed ✓');}},ttlMs);
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){const cat=ALL_CATS.find(c=>c.id===activeCat);if(!CACHE[activeCat]||Date.now()-CACHE[activeCat].ts>cat.ttl*60000){delete CACHE[activeCat];loadCat(activeCat,true);}}
});

/* ── Pull to refresh (mobile) ── */
(function(){
  let startY=0, pulling=false;
  const THRESHOLD=80;
  document.addEventListener('touchstart',e=>{
    if(window.scrollY===0) startY=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!startY) return;
    const dy=e.touches[0].clientY-startY;
    if(dy>THRESHOLD&&window.scrollY===0) pulling=true;
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(pulling){
      pulling=false; startY=0;
      delete CACHE[activeCat];
      loadCat(activeCat,true);
      toast('Refreshing…');
    }
    startY=0;
  },{passive:true});
})();

/* ══════════════════════════════════════════
   TICKER
══════════════════════════════════════════ */
function updateTicker(){
  const track=$("ticker-track");if(!track)return;
  const allItems=[];
  Object.entries(CACHE).forEach(([catId,data])=>{
    if(!data||!data.items)return;
    const cat=ALL_CATS.find(c=>c.id===catId);
    const label=cat?cat.label:catId;
    data.items.slice(0,5).forEach(item=>{if(item.title)allItems.push({...item,_catId:catId,_catLabel:label});});
  });
  if(!allItems.length)return;
  allItems.sort((a,b)=>{const da=new Date(a.date).getTime()||0,db=new Date(b.date).getTime()||0;return db-da;});
  const seen=new Set();
  const items=allItems.filter(i=>{const k=i.title.slice(0,50).toLowerCase();if(seen.has(k))return false;seen.add(k);return true;}).slice(0,30);
  track.innerHTML='';
  // Build doubled list for seamless CSS loop
  for(let pass=0;pass<2;pass++){
    items.forEach(item=>{
      const span=document.createElement('span');
      span.className='t-item';
      span.innerHTML=`<span class="t-cat">${esc(item._catLabel)}</span><span class="t-sep">—</span><span class="t-headline">${esc(item.title.slice(0,88)+(item.title.length>88?'…':''))}</span>`;
      span.addEventListener('click',()=>{
        // Switch to category and scroll nav
        activeCat=item._catId;activeTypes.clear();visCount=PG;
        document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===item._catId));
        const titleEl=$("sec-title"); if(titleEl) titleEl.textContent=item._catLabel;
        loadCat(item._catId);
        setTimeout(()=>{const btn=document.querySelector(`.cat-btn[data-cat="${item._catId}"]`);if(btn)btn.scrollIntoView({inline:'nearest',behavior:'smooth'});},100);
      });
      track.appendChild(span);
    });
  }
  // Speed: each headline gets ~6s of reading time
  // items are doubled for seamless loop, so half the width = actual content
  const perItem = 6; // seconds per headline - readable pace
  const dur = Math.max(40, Math.min(180, items.length * perItem));
  const prevCount = parseInt(track.dataset.itemCount||'0');
  // Only restart animation when item count changes significantly (avoids jarring resets)
  if(prevCount === 0){
    // First load - start animation
    track.dataset.itemCount = items.length;
    track.style.animation = 'ticker-scroll '+dur+'s linear infinite';
  } else if(Math.abs(items.length - prevCount) > 2){
    // More items loaded - update duration smoothly without restart
    track.dataset.itemCount = items.length;
    track.style.animationDuration = dur+'s';
  }
  // else: don't touch animation - let it run uninterrupted
}

let _uid=0;
function buildCard(item){
  const card=document.createElement('div');
  card.className='card';
  const t=item.type;
  const badge=t==='guardian'?'Guardian':t==='hn'?'HN':'RSS';
  const ago=timeAgo(item.date);

  const head=document.createElement('div');head.className='card-head';
  head.innerHTML=`
    <div class="card-top">
      <span class="src-name">${esc(item.srcName||item.source)}</span>
      <span class="src-dot"></span>
      <span class="read-time">${readTime(item.full||item.snippet)}</span>
      <span class="card-ago">${esc(ago)}</span>
    </div>
    <div class="card-title">${esc(item.title)}</div>
    <div class="card-snip">${esc(item.snippet)}</div>`;
  card.appendChild(head);

  const body=document.createElement('div');body.className='card-body';
  const hasText=item.full&&item.full.length>30;
  // When no extra context, show the full untruncated snippet (removes the "…" cutoff)
  const bodyText=hasText?item.full:(item.snippet&&item.snippet.endsWith('…')?item.snippet.replace(/…$/, '')+(item.snippet.length>30?'':''): '');
  const bodyHtml=bodyText?`<p>${esc(bodyText)}</p>`:'';
  body.innerHTML=`
    ${bodyHtml?`<div class="card-full">${bodyHtml}</div>`:''}
    <div class="card-btns">
      <a class="btn-read" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Read full article ↗</a>
      <button class="btn-share" data-url="${esc(item.url)}" data-title="${esc(item.title)}">Share</button>
      <button class="bm-btn${isBookmarked(item.url)?' saved':''}" data-url="${esc(item.url)}"></button>
    </div>`;
  card.appendChild(body);

  /* hover = expand on desktop, click on mobile */
  const isTouchDevice=()=>window.matchMedia('(hover:none)').matches;
  card.addEventListener('mouseenter',()=>{if(isTouchDevice())return;document.querySelectorAll('.card.open').forEach(c=>{if(c!==card)c.classList.remove('open');});card.classList.add('open');});
  card.addEventListener('mouseleave',()=>{if(isTouchDevice())return;card.classList.remove('open');});
  head.addEventListener('click',()=>{if(!isTouchDevice())return;const was=card.classList.contains('open');document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));if(!was)card.classList.add('open');});

  body.querySelector('.btn-share').addEventListener('click',async e=>{
    e.stopPropagation();
    const url=e.currentTarget.dataset.url,title=e.currentTarget.dataset.title;
    if(navigator.share){try{await navigator.share({title,url});}catch{}}
    else{try{await navigator.clipboard.writeText(url);toast('Link copied ✓');}catch{toast(url);}}
  });
  body.querySelector('.bm-btn').addEventListener('click',e=>{e.stopPropagation();toggleBookmark(item);});
  return card;
}

  const panel=$("bm-panel"),overlay=$("overlay"),isOpen=panel.classList.contains('open');
  $("manage-panel").classList.remove('open');$("btn-manage").classList.remove('active');
  $("search-bar").classList.remove('show');$("btn-search").classList.remove('active');
  if(!isOpen){renderBmPanel();panel.classList.add('open');overlay.classList.add('show');$("btn-bookmarks").classList.add('active');}
  else{panel.classList.remove('open');overlay.classList.remove('show');$("btn-bookmarks").classList.remove('active');}
});
$("bm-clear-all").addEventListener('click',()=>{if(!bookmarks.length)return;if(!confirm('Clear all bookmarks?'))return;bookmarks=[];saveBookmarks(bookmarks);updateBmCount();renderBmPanel();document.querySelectorAll('.bm-btn.saved').forEach(b=>b.classList.remove('saved'));toast('Bookmarks cleared');});

/* ── overlay ── */
$("overlay").addEventListener('click',()=>{
  $("manage-panel").classList.remove('open');$("bm-panel").classList.remove('open');$("overlay").classList.remove('show');
  $("btn-manage").classList.remove('active');$("btn-bookmarks").classList.remove('active');
});

/* ── search ── */
$("btn-search").addEventListener('click',()=>{
  const bar=$("search-bar"),isShow=bar.classList.contains('show');
  $("bm-panel").classList.remove('open');$("manage-panel").classList.remove('open');$("overlay").classList.remove('show');$("btn-bookmarks").classList.remove('active');$("btn-manage").classList.remove('active');
  if(!isShow){bar.classList.add('show');$("btn-search").classList.add('active');setTimeout(()=>$("search-input").focus(),50);}
  else{bar.classList.remove('show');$("btn-search").classList.remove('active');searchQuery='';$("search-input").value='';renderFeed();}
});
$("search-input").addEventListener('input',e=>{searchQuery=e.target.value.trim();visCount=PG;renderFeed();});
$("search-input").addEventListener('keydown',e=>{if(e.key==='Escape'){$("search-bar").classList.remove('show');$("btn-search").classList.remove('active');searchQuery='';$("search-input").value='';renderFeed();}});

/* ── modal ── */
$("mcls").addEventListener('click',()=>$("modal-bg").classList.add('hidden'));
$("modal-bg").addEventListener('click',e=>{if(e.target===$("modal-bg"))$("modal-bg").classList.add('hidden');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$("modal-bg").classList.add('hidden');});

/* ── refresh ── */
function refresh(){delete CACHE[activeCat];loadCat(activeCat,true);toast('Refreshing…');}
$("btn-refresh").addEventListener('click',()=>{Object.keys(CACHE).forEach(k=>delete CACHE[k]);loadCat(activeCat,true);toast('Refreshed ✓');});

/* ── theme ── */
let theme=prefs.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  const svg=$("theme-svg");
  if(svg) svg.innerHTML=theme==='dark'
    ?'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    :'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  prefs.theme=theme;savePrefs(prefs);
}
applyTheme();
$("btn-theme").addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme();});

/* ── auto-refresh every TTL, and on tab return ── */
setInterval(()=>{delete CACHE[activeCat];loadCat(activeCat,true);},15*60*1000);

/* ── background prefetch other tabs after 12s ── */
setTimeout(()=>{
  visibleCats().filter(c=>c.id!==activeCat).slice(0,4).forEach((c,i)=>
    setTimeout(()=>loadCat(c.id,false,true),i*4000)
  );
},12000);

/* ── INIT ── */
// Clear ALL old pref keys to ensure fresh start
['nb.prefs','nb.prefs2','nb.prefs3'].forEach(k=>{ try{localStorage.removeItem(k);}catch{} });
buildCatNav();
updateBmCount();
const _initTitle=$("sec-title"); if(_initTitle) _initTitle.textContent=ALL_CATS.find(c=>c.id===activeCat)?.label||'World News';
loadCat(activeCat);
</script>
</body>
</html>
