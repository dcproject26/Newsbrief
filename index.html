<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="NewsBrief — Verified news, no noise."/>
<title>NewsBrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#fafaf9;
  --surface:#ffffff;
  --surface2:#f4f3f0;
  --surface3:#eceae5;
  --border:#e4e2dc;
  --border2:#ccc9c0;
  --ink:#111110;
  --ink2:#3d3c39;
  --ink3:#79776e;
  --ink4:#a8a59c;
  --ink5:#c8c5bc;
  --accent:#c0392b;
  --accent-pale:rgba(192,57,43,.08);
  --accent-mid:rgba(192,57,43,.15);
  --green:#1a6b3c;
  --green-pale:rgba(26,107,60,.08);
  --red:#c0392b;
  --red-pale:rgba(192,57,43,.07);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --r:8px;--r-sm:5px;--r-xs:3px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --sh-lg:0 2px 12px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.08);
  --hdr-h:52px;
  --nav-h:40px;
}
[data-theme="dark"]{
  --bg:#0d0d0c;
  --surface:#161614;
  --surface2:#1e1e1b;
  --surface3:#262622;
  --border:#2a2a26;
  --border2:#363630;
  --ink:#f0ede6;
  --ink2:#b5b2a8;
  --ink3:#737069;
  --ink4:#4a4843;
  --ink5:#333230;
  --accent:#e05240;
  --accent-pale:rgba(224,82,64,.09);
  --accent-mid:rgba(224,82,64,.18);
  --green:#2d9e5f;
  --green-pale:rgba(45,158,95,.09);
  --red:#e05240;
  --red-pale:rgba(224,82,64,.08);
  --sh:0 1px 2px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.2);
  --sh-lg:0 2px 12px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .2s,color .2s}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.hdr{
  height:var(--hdr-h);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:300;
  display:flex;align-items:center;
}
.hdr-inner{
  width:100%;max-width:720px;margin:0 auto;
  padding:0 1.25rem;
  display:flex;align-items:center;gap:0;
}
.logo{
  font-family:var(--serif);
  font-size:1.35rem;
  font-weight:400;
  font-style:italic;
  letter-spacing:-.01em;
  color:var(--ink);
  flex:1;
  line-height:1;
}
.logo b{font-style:normal;font-weight:400;color:var(--accent)}
.hdr-btns{display:flex;align-items:center;gap:2px}
.hbtn{
  width:32px;height:32px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink3);transition:background .12s,color .12s;
  position:relative;
}
.hbtn:hover{background:var(--surface2);color:var(--ink)}
.hbtn.active{color:var(--accent)}
.hbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
.badge-count{
  position:absolute;top:4px;right:3px;
  min-width:14px;height:14px;padding:0 3px;
  background:var(--accent);color:#fff;
  border-radius:99px;font-size:.5rem;font-weight:700;
  display:none;align-items:center;justify-content:center;
  line-height:1;
}

/* ── LIVE TICKER ── */
.ticker{
  background:var(--accent);overflow:hidden;
  padding:.22rem 0;display:flex;align-items:center;
}
.ticker-lbl{
  flex-shrink:0;font-size:.58rem;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.75);
  padding:0 .75rem;border-right:1px solid rgba(255,255,255,.2);
  margin-right:.5rem;
}
.ticker-outer{overflow:hidden;flex:1}
.ticker-track{
  display:inline-flex;gap:1.6rem;
  animation:ticker 60s linear infinite;white-space:nowrap;
}
.ticker-track:hover{animation-play-state:paused}
.t-item{font-size:.67rem;font-weight:400;color:rgba(255,255,255,.88);font-style:italic}
.t-sep{color:rgba(255,255,255,.25);font-style:normal}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── CATEGORY NAV ── */
.cat-nav{
  height:var(--nav-h);
  background:var(--bg);
  border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
  position:sticky;top:var(--hdr-h);z-index:299;
  display:flex;align-items:stretch;
}
.cat-nav::-webkit-scrollbar{display:none}
.cat-nav-inner{
  max-width:720px;margin:0 auto;width:100%;
  display:flex;padding:0 .5rem;
}
.cat-btn{
  padding:0 .75rem;
  font-size:.72rem;font-weight:500;
  letter-spacing:.01em;
  color:var(--ink3);
  border-bottom:2px solid transparent;
  white-space:nowrap;
  display:flex;align-items:center;gap:.3rem;
  transition:color .12s,border-color .12s;
  position:relative;
}
.cat-btn:hover{color:var(--ink2)}
.cat-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cat-dot{
  width:4px;height:4px;border-radius:50%;
  background:var(--accent);
  opacity:0;transition:opacity .2s;
  flex-shrink:0;
}
.cat-btn.loaded .cat-dot{opacity:1}

/* ── MANAGE PANEL ── */
.manage-panel{
  background:var(--surface);
  position:fixed;top:0;left:0;right:0;z-index:500;
  transform:translateY(-110%);
  transition:transform .28s cubic-bezier(.16,1,.3,1);
  border-bottom:1px solid var(--border2);
  box-shadow:var(--sh-lg);
  max-height:85vh;overflow-y:auto;
}
.manage-panel.open{transform:translateY(0)}
.manage-inner{max-width:720px;margin:0 auto;padding:1.25rem}
.manage-inner h3{
  font-size:.65rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.85rem;
}
.manage-grid{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.85rem}
.mcat-chip{
  display:flex;align-items:center;gap:.35rem;
  padding:.35rem .65rem;border-radius:99px;
  border:1px solid var(--border2);
  font-size:.73rem;font-weight:500;color:var(--ink2);
  transition:all .12s;
}
.mcat-chip:hover{border-color:var(--ink3);color:var(--ink)}
.mcat-chip.pinned{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mcat-chip:not(.pinned){opacity:.6}
.mcat-chip .chip-ico{font-size:.75rem}
.manage-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.manage-btn{
  padding:.35rem .8rem;border:1px solid var(--border2);
  border-radius:var(--r-sm);font-size:.72rem;font-weight:500;
  color:var(--ink2);transition:all .12s;
}
.manage-btn:hover{border-color:var(--ink3);color:var(--ink)}
.manage-hint{font-size:.68rem;color:var(--ink3);margin-top:.6rem;line-height:1.5}

/* ── BOOKMARK PANEL ── */
.bm-panel{
  background:var(--surface);
  position:fixed;top:0;left:0;right:0;z-index:500;
  transform:translateY(-110%);
  transition:transform .28s cubic-bezier(.16,1,.3,1);
  border-bottom:1px solid var(--border2);
  box-shadow:var(--sh-lg);
  max-height:85vh;overflow-y:auto;
}
.bm-panel.open{transform:translateY(0)}
.bm-inner{max-width:720px;margin:0 auto;padding:1.25rem}
.bm-inner h3{
  font-size:.65rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:.85rem;
  display:flex;align-items:center;gap:.75rem;
}
.bm-empty{font-size:.85rem;color:var(--ink3);padding:1.5rem 0;text-align:center;line-height:1.6}
.bm-item{padding:.85rem 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.35rem}
.bm-item:last-child{border-bottom:none}
.bm-item-title{
  font-family:var(--serif);font-size:.95rem;
  color:var(--ink);line-height:1.35;
}
.bm-item-meta{display:flex;align-items:center;gap:.5rem}
.bm-item-src{font-size:.65rem;font-weight:600;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.bm-item-time{font-size:.63rem;color:var(--ink4)}
.bm-item-actions{display:flex;gap:.35rem;margin-top:.1rem}
.bm-read{
  font-size:.72rem;font-weight:500;color:var(--ink);
  padding:.28rem .65rem;border:1px solid var(--border2);
  border-radius:var(--r-sm);transition:all .12s;
}
.bm-read:hover{border-color:var(--accent);color:var(--accent)}
.bm-remove{
  font-size:.72rem;font-weight:400;color:var(--ink3);
  padding:.28rem .65rem;border:1px solid var(--border);
  border-radius:var(--r-sm);transition:all .12s;
}
.bm-remove:hover{border-color:var(--red);color:var(--red)}
.bm-clear{
  padding:.28rem .65rem;border:1px solid var(--border2);
  border-radius:var(--r-sm);font-size:.68rem;font-weight:500;
  color:var(--ink3);transition:all .12s;margin-left:auto;
}
.bm-clear:hover{border-color:var(--red);color:var(--red)}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:499;display:none;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* ── SEARCH BAR ── */
.search-bar{max-width:720px;margin:0 auto;padding:.6rem 1.25rem .2rem;display:none}
.search-bar.show{display:block}
.search-input{
  width:100%;padding:.55rem .85rem;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface2);color:var(--ink);
  font-family:var(--sans);font-size:.88rem;font-weight:400;
  outline:none;transition:border-color .15s,background .15s;
}
.search-input:focus{border-color:var(--ink3);background:var(--surface)}
.search-input::placeholder{color:var(--ink4)}

/* ── TYPE FILTER ── */
.type-bar{
  max-width:720px;margin:0 auto;
  padding:.5rem 1.25rem .15rem;
  display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;
  min-height:1px;
}
.type-lbl{
  font-size:.62rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink4);margin-right:.15rem;
}
.tchip{
  padding:.22rem .55rem;
  border:1px solid var(--border2);border-radius:99px;
  font-size:.68rem;font-weight:500;color:var(--ink3);
  transition:all .12s;
}
.tchip:hover{border-color:var(--ink3);color:var(--ink2)}
.tchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ── SRC STATUS ── */
.src-row{
  max-width:720px;margin:0 auto;
  padding:.3rem 1.25rem .1rem;
  display:flex;gap:.25rem;flex-wrap:wrap;min-height:1px;
}
.sc{
  font-size:.58rem;font-weight:600;padding:.1rem .35rem;
  border-radius:var(--r-xs);letter-spacing:.04em;text-transform:uppercase;
}
.sc.ok{background:var(--green-pale);color:var(--green)}
.sc.fail{background:var(--red-pale);color:var(--red);text-decoration:line-through;opacity:.55}
.sc.wait{background:var(--surface3);color:var(--ink4)}

/* ── FEED ── */
.feed{max-width:720px;margin:0 auto;padding:.65rem 1.25rem 5rem}

/* ── STATES ── */
.state-box{padding:3rem 1rem;text-align:center;color:var(--ink3)}
.spin-ring{
  width:28px;height:28px;
  border:2px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;
  margin:0 auto .85rem;
}
@keyframes spin{to{transform:rotate(360deg)}}
.state-ico{font-size:1.75rem;margin-bottom:.6rem;display:block}
.state-box p{font-size:.85rem;line-height:1.55;margin-top:.35rem;color:var(--ink3)}
.retry-btn{
  margin-top:.85rem;padding:.38rem .9rem;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  font-size:.75rem;font-weight:500;color:var(--ink2);transition:all .12s;
}
.retry-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── CARDS ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  margin-bottom:.45rem;
  overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:var(--border2)}
.card.open{border-color:var(--border2);box-shadow:var(--sh-lg)}

.card-head{
  padding:.9rem 1rem .85rem;
  cursor:pointer;user-select:none;
}
.card-top{
  display:flex;align-items:center;
  gap:.4rem;margin-bottom:.5rem;
}
.src-name{
  font-size:.67rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);
}
.src-dot{
  width:2px;height:2px;border-radius:50%;
  background:var(--border2);flex-shrink:0;
}
.read-time{font-size:.67rem;color:var(--ink4);font-weight:400}
.card-ago{font-size:.67rem;color:var(--ink4);margin-left:auto;white-space:nowrap}
.card-title{
  font-family:var(--serif);
  font-size:1.05rem;
  font-weight:400;
  line-height:1.38;
  color:var(--ink);
  margin-bottom:.42rem;
  letter-spacing:-.01em;
}
.card-row{display:flex;align-items:flex-start;gap:.5rem}
.card-snip{
  font-size:.82rem;line-height:1.62;color:var(--ink3);flex:1;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  font-weight:400;
}
.card-chev{
  flex-shrink:0;color:var(--ink5);
  font-size:.7rem;margin-top:.2rem;
  transition:transform .2s;line-height:1;
}
.card.open .card-chev{transform:rotate(180deg)}

/* ── CARD BODY ── */
.card-body{
  display:none;border-top:1px solid var(--border);
  padding:.85rem 1rem .9rem;
  flex-direction:column;gap:.75rem;
}
.card.open .card-body{display:flex}
.card-full{font-size:.84rem;line-height:1.72;color:var(--ink2)}
.card-full p{margin-bottom:.6rem}
.card-full p:last-child{margin-bottom:0}
.card-btns{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.btn-read{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.42rem .9rem;
  background:var(--accent);border-radius:var(--r-sm);
  font-size:.75rem;font-weight:600;color:#fff;
  text-decoration:none;transition:opacity .12s;
  letter-spacing:.01em;
}
.btn-read:hover{opacity:.88}
.btn-share{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.42rem .9rem;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  font-size:.75rem;font-weight:500;color:var(--ink2);transition:all .12s;
}
.btn-share:hover{border-color:var(--ink3);color:var(--ink)}
.bm-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.42rem .9rem;
  border:1px solid var(--border2);border-radius:var(--r-sm);
  font-size:.75rem;font-weight:500;color:var(--ink2);
  transition:all .12s;margin-left:auto;
}
.bm-btn:hover{border-color:var(--ink3);color:var(--ink)}
.bm-btn.saved{background:var(--accent-pale);border-color:var(--accent-mid);color:var(--accent)}
.bm-btn::after{content:"Save"}
.bm-btn.saved::after{content:"Saved ✓"}

/* ── LOAD MORE ── */
.load-more{
  display:block;width:100%;
  padding:.6rem;margin-top:.25rem;
  border:1px solid var(--border2);border-radius:var(--r);
  font-size:.78rem;font-weight:500;color:var(--ink3);
  background:transparent;text-align:center;transition:all .12s;
}
.load-more:hover{border-color:var(--ink3);color:var(--ink)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.25rem;left:50%;
  transform:translateX(-50%);
  background:var(--ink);color:var(--bg);
  padding:.45rem 1rem;border-radius:99px;
  font-size:.75rem;font-weight:500;z-index:999;
  pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
  animation:t-in .18s ease;
}
.toast.hidden{display:none}
@keyframes t-in{from{opacity:0;transform:translateX(-50%) translateY(5px)}}

@media(max-width:480px){
  .logo{font-size:1.2rem}
  .card-title{font-size:.98rem}
  .feed,.type-bar,.src-row,.search-bar{padding-left:.9rem;padding-right:.9rem}
  .manage-inner,.bm-inner{padding:.9rem}
  .cat-btn{padding:0 .6rem;font-size:.7rem}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <div class="logo">News<span>Brief</span></div>
    <div class="hdr-btns">
      <button class="hbtn" id="btn-search" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="hbtn" id="btn-bookmarks" title="Bookmarks" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="badge-count" id="bm-count"></span>
      </button>
      <button class="hbtn" id="btn-manage" title="Manage categories" aria-label="Manage categories">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <button class="hbtn" id="btn-refresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" id="ref-svg"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
      </button>
      <button class="hbtn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme" id="btn-theme">
        <svg viewBox="0 0 24 24" id="theme-svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="ticker"><div class="ticker-lbl">Live</div><div class="ticker-outer"><div class="ticker-track" id="ticker-track"><span class="t-item">Loading…</span></div></div></div>

<nav class="cat-nav"><div class="cat-nav-inner" id="cat-nav"></div></nav>

<div class="manage-panel" id="manage-panel">
  <div class="manage-inner">
    <h3>Manage categories</h3>
    <div class="manage-grid" id="manage-grid"></div>
    <div class="manage-actions">
      <button class="manage-btn" id="btn-reset-cats">Reset to default</button>
    </div>
    <p class="manage-hint">Tap any category to <strong>add</strong> or <strong>remove</strong> it from your nav bar. Blue = currently in nav.</p>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="search-bar" id="search-bar">
  <input class="search-input" id="search-input" type="search" placeholder="Search stories…" autocomplete="off" spellcheck="false"/>
</div>
<div class="bm-panel" id="bm-panel">
  <div class="bm-inner">
    <h3>Bookmarks <button class="bm-clear" id="bm-clear-all">Clear all</button></h3>
    <div id="bm-list"></div>
  </div>
</div>
<div class="type-bar" id="type-bar"></div>
<div class="src-row" id="src-row"></div>
<main class="feed" id="feed"></main>
<div class="toast hidden" id="toast"></div>

<script>
'use strict';

/* ── timeout via Promise.race only ── */
const go = (url, opts) => Promise.race([
  fetch(url, opts||{}),
  new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))
]);

/* ════════════════════════════════════════════
   ALL CATEGORIES — verified sources only
   No Reddit. Sources: BBC, Reuters, Guardian,
   Al Jazeera, The Hindu, Google News RSS,
   Hacker News (curated links to real articles)
════════════════════════════════════════════ */
const ALL_CATS = [
  { id:'world', emoji:'🌍', label:'World', ttl:8, sources:[

function isBookmarked(url){ return bookmarks.some(b=>b.url===url); }
function toggleBookmark(item){
  const idx = bookmarks.findIndex(b=>b.url===item.url);
  if(idx>=0){ bookmarks.splice(idx,1); toast('Removed from bookmarks'); }
  else{
    bookmarks.unshift({
      url:item.url, title:item.title,
      source:item.srcName||item.source,
      snippet:item.snippet, date:item.date,
      savedAt:Date.now(),
    });
    if(bookmarks.length>100) bookmarks = bookmarks.slice(0,100);
    toast('Bookmarked ✓');
  }
  saveBookmarks(bookmarks);
  updateBmCount();
  // update any visible bookmark buttons for this url
  document.querySelectorAll(`.bm-btn[data-url="${CSS.escape(item.url)}"]`).forEach(btn=>{
    btn.classList.toggle('saved', isBookmarked(item.url));
  });
}
function updateBmCount(){
  const cnt = $('bm-count');
  if(!cnt) return;
  if(bookmarks.length>0){ cnt.textContent=bookmarks.length>99?'99+':bookmarks.length; cnt.style.display='inline-flex'; }

/* ── read time ── */
function readTime(text){
  const words = (text||'').trim().split(/\s+/).filter(Boolean).length;
  const mins = Math.max(1, Math.round(words / 200));
  return mins === 1 ? '1 min read' : `${mins} min read`;
}

/* ── utils ── */
const $     = id=>document.getElementById(id);
const esc   = s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s=>{const d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''};
const trunc = (s,n)=>{s=strip(s);return s.length>n?s.slice(0,n)+'…':s};

function timeAgo(d){
  if(!d) return '';
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(isNaN(s)||s<0) return '';
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

let _tt;
function toast(msg,dur=2200){
  const t=$('toast');t.textContent=msg;t.classList.remove('hidden');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.add('hidden'),dur);
}

════════════════════════════════════════════ */
async function rss_r2j(url,n){
  const r=await go(R2J+encodeURIComponent(url));
  if(!r.ok) throw new Error('r2j:'+r.status);
  const j=await r.json();
  if(j.status!=='ok') throw new Error('r2j:'+j.status);
  return (j.items||[]).filter(i=>i.title).map(i=>({
    title:strip(i.title),url:i.link||i.guid||'#',
    snippet:trunc(i.description||i.content||'',300),
    full:trunc(i.description||i.content||'',1200),
    source:n,date:i.pubDate||'',type:'rss',
  }));
}
async function rss_proxy(url,n,base){
  const r=await go(base+encodeURIComponent(url));
  if(!r.ok) throw new Error('p:'+r.status);
  const txt=base===AO?(await r.json()).contents:await r.text();
  const xml=new DOMParser().parseFromString(txt,'text/xml');
  if(xml.querySelector('parsererror')) throw new Error('xml');
  return Array.from(xml.querySelectorAll('item,entry')).slice(0,25).map(i=>{
    const g=t=>i.querySelector(t)?.textContent?.trim()||'';
    const gl=t=>i.querySelector(t)?.getAttribute('href')||'';
    const link=(g('link')||gl('link')||g('guid')||'#').trim();
    const desc=g('description')||g('summary')||g('content')||'';
    const title=strip(g('title'));
    if(!title) return null;
    return{title,url:link,snippet:trunc(desc,300),full:trunc(desc,1200),
      source:n,date:g('pubDate')||g('published')||g('updated')||'',type:'rss'};
  }).filter(Boolean);
}
async function fetchRSS(url,n){
  try{const r=await rss_r2j(url,n);if(r.length)return r;throw 0;}
  catch{try{return await rss_proxy(url,n,AO);}
    catch{try{return await rss_proxy(url,n,COR);}
      catch(e){console.warn('RSS fail',n,e.message);return null;}}}
}
async function fetchGuardian(q,section,n){
  const p=new URLSearchParams({q,section,'show-fields':'trailText,headline','page-size':'15','order-by':'newest','api-key':'test'});
  const r=await go(`${GAPI}?${p}`);
  if(!r.ok) throw new Error('g:'+r.status);
  const j=await r.json();
  return (j.response?.results||[]).map(a=>({
    title:strip(a.fields?.headline||a.webTitle||''),url:a.webUrl||'#',
    snippet:trunc(a.fields?.trailText||'',300),full:trunc(a.fields?.trailText||'',1200),
    source:n,date:a.webPublicationDate||'',type:'guardian',
  })).filter(i=>i.title);
}
async function fetchHN(){
  const ids=await go(HN_T).then(r=>r.json());
  const hits=await Promise.allSettled(ids.slice(0,22).map(id=>go(HN_I(id)).then(r=>r.json())));
  return hits.filter(r=>r.status==='fulfilled'&&r.value?.title).map(r=>r.value).map(i=>({
    title:i.title,url:i.url||`https://news.ycombinator.com/item?id=${i.id}`,
    snippet:`${i.score||0} pts · ${i.descendants||0} comments — Hacker News`,
    full:'',source:'Hacker News',score:i.score,
    date:i.time?new Date(i.time*1000).toISOString():'',type:'hn',
  }));
}

/* ════════════════════════════════════════════

════════════════════════════════════════════ */
let _refreshTimer=null;
async function loadCat(id,force=false){
  const cat=ALL_CATS.find(c=>c.id===id);
  const ttlMs=cat.ttl*60000;
  if(!force&&CACHE[id]&&Date.now()-CACHE[id].ts<ttlMs){
    curItems=CACHE[id].items;activeTypes.clear();visCount=PG;
    renderTypeBar();renderFeed();scheduleRefresh(id,ttlMs);return;
  }
  showLoading();
  renderSrcRow(cat.sources.map(s=>s.n),'wait',{});
  const tasks=cat.sources.map(async s=>{
    try{
      let items=null;
      if(s.t==='rss') items=await fetchRSS(s.url,s.n);
      else if(s.t==='g') items=await fetchGuardian(s.q,s.section,s.n);
      else if(s.t==='hn') items=await fetchHN();
      return{n:s.n,items:items||[]};
    }catch(e){console.warn(s.n,e.message);return{n:s.n,items:[]};}
  });
  const results=await Promise.allSettled(tasks);
  const sm={};let items=[];
  results.forEach(r=>{
    if(r.status==='fulfilled'){
      const{n,items:its}=r.value;
      sm[n]=its.length?'ok':'fail';
      items.push(...its.map(i=>({...i,srcName:n})));
    }
  });
  renderSrcRow(cat.sources.map(s=>s.n),null,sm);
  const seen=new Set();
  items=items.filter(i=>{
    const k=i.title.slice(0,60).toLowerCase().replace(/\W+/g,'');
    if(seen.has(k))return false;seen.add(k);return true;
  });
  items.sort((a,b)=>{
    const va=new Date(a.date).getTime()||0,vb=new Date(b.date).getTime()||0;
    if(va&&vb)return vb-va;
    if(va)return -1;if(vb)return 1;
    return(b.score||0)-(a.score||0);
  });
  if(!items.length){showEmpty(id);return;}
  CACHE[id]={ts:Date.now(),items};
  curItems=items;activeTypes.clear();visCount=PG;
  document.querySelectorAll('.cat-btn').forEach(b=>{if(b.dataset.cat===id)b.classList.add('loaded');});
  if(id===activeCat)updateTicker(items.slice(0,20));
  renderTypeBar();renderFeed();scheduleRefresh(id,ttlMs);
}

function scheduleRefresh(id,ttlMs){
  clearTimeout(_refreshTimer);
  _refreshTimer=setTimeout(()=>{
    if(activeCat===id){delete CACHE[id];loadCat(id,true);toast('Auto-refreshed ✓');}
  },ttlMs);
}

  if(!document.hidden){
    const cat=ALL_CATS.find(c=>c.id===activeCat);
    if(!CACHE[activeCat]||Date.now()-CACHE[activeCat].ts>cat.ttl*60000){
      delete CACHE[activeCat];loadCat(activeCat,true);
    }
  }
});

  const labels={rss:'RSS',guardian:'Guardian',hn:'HN'};
  bar.innerHTML=`<span class="type-lbl">Filter</span>`+types.map(t=>`
    <button class="tchip${activeTypes.has(t)?' on':''}" data-t="${t}">${labels[t]||t}</button>
  `).join('');
  bar.querySelectorAll('.tchip').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.t;
    if(activeTypes.has(t))activeTypes.delete(t);else activeTypes.add(t);
    visCount=PG;renderTypeBar();renderFeed();
  }));

function showLoading(){
  $('feed').innerHTML=`<div class="state-box"><div class="spin-ring"></div><p>Fetching stories…</p></div>`;
  $('type-bar').innerHTML='';
}
function showEmpty(id){
  $('feed').innerHTML=`<div class="state-box">
    <p style="font-size:.88rem;color:var(--ink3);margin-bottom:.75rem">No stories loaded.<br>Check your connection and try again.</p>
    <button class="retry-btn" onclick="refresh()">Try again</button></div>`;
}
let searchQuery = '';
function filtered(){
  let items = activeTypes.size ? curItems.filter(i=>activeTypes.has(i.type)) : curItems;
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    items = items.filter(i=>
      i.title.toLowerCase().includes(q) ||
      (i.snippet||'').toLowerCase().includes(q) ||
      (i.srcName||i.source||'').toLowerCase().includes(q)
    );
  }
  return items;
}
function renderFeed(){
  const feed=$('feed');feed.innerHTML='';
  const items=filtered();
  if(!items.length){
    feed.innerHTML=`<div class="state-box"><p style="font-size:.88rem;color:var(--ink3)">No stories match this filter.</p></div>`;
    return;
  }
  items.slice(0,visCount).forEach((item,i)=>feed.appendChild(buildCard(item)));
  if(items.length>visCount){
    const btn=document.createElement('button');
    btn.className='load-more';
    btn.textContent=`Show ${Math.min(PG,items.length-visCount)} more`;
    btn.onclick=()=>{visCount+=PG;renderFeed();};
    feed.appendChild(btn);
  }
}

/* ── CARD ── */
let _uid=0;
function buildCard(item){
  const id='c'+(++_uid);
  const t=item.type;
  const badge=t==='guardian'?'Guardian':t==='hn'?'HN':'RSS';
  const ago=timeAgo(item.date);

  const card=document.createElement('div');
  card.className='card';card.dataset.cid=id;

  const head=document.createElement('div');head.className='card-head';
  head.innerHTML=`
    <div class="card-top">
      <span class="src-name">${esc(item.srcName||item.source)}</span>
      <span class="src-dot"></span>
      <span class="read-time">${readTime(item.full||item.snippet)}</span>
      <span class="card-ago">${esc(ago)}</span>
    </div>
    <div class="card-title">${esc(item.title)}</div>
    <div class="card-row">
      <div class="card-snip">${esc(item.snippet)}</div>
      <span class="card-chev">▾</span>
    </div>`;
  card.appendChild(head);

  const body=document.createElement('div');body.className='card-body';
  const hasText=item.full&&item.full.length>30;
  const bodyHtml=hasText
    ?item.full.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')
    :'<p>Click "Read full article" to view the complete story.</p>';
  body.innerHTML=`
    <div class="card-full">${bodyHtml}</div>
    <div class="card-btns">
      <a class="btn-read" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Read full article ↗</a>
      <button class="btn-share" data-url="${esc(item.url)}" data-title="${esc(item.title)}">Share</button>
      <button class="bm-btn${isBookmarked(item.url)?' saved':''}" data-url="${esc(item.url)}" title="Bookmark" aria-label="Bookmark"></button>
    </div>`;
  card.appendChild(body);

  head.addEventListener('click',()=>{
    const wasOpen=card.classList.contains('open');
    document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));
    if(!wasOpen){
      card.classList.add('open');
      setTimeout(()=>{
        const top=card.getBoundingClientRect().top+window.scrollY-120;
        window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
      },60);
    }
  });
  body.querySelector('.btn-share').addEventListener('click',async e=>{
    e.stopPropagation();
    const url=e.currentTarget.dataset.url,title=e.currentTarget.dataset.title;
    if(navigator.share){try{await navigator.share({title,url});}catch{}}
    else{try{await navigator.clipboard.writeText(url);toast('Link copied ✓');}catch{toast(url);}}
  });
  body.querySelector('.bm-btn').addEventListener('click',e=>{
    e.stopPropagation();
    toggleBookmark(item);
  });
  return card;
}

/* ════════════════════════════════════════════
   CAT NAV
════════════════════════════════════════════ */
function buildCatNav(){
  const nav=$('cat-nav');nav.innerHTML='';
  visibleCats().forEach(c=>{
    const b=document.createElement('button');
    b.className='cat-btn'+(c.id===activeCat?' active':'');
    b.dataset.cat=c.id;
    b.innerHTML=`<span class="cat-dot"></span>${c.emoji} ${c.label}`;
    if(CACHE[c.id]) b.classList.add('loaded');
    b.addEventListener('click',()=>{
      if(activeCat===c.id)return;
      activeCat=c.id;activeTypes.clear();visCount=PG;
      document.querySelectorAll('.cat-btn').forEach(x=>x.classList.toggle('active',x.dataset.cat===c.id));
      loadCat(c.id);
    });
    nav.appendChild(b);
  });
  // ensure active cat is visible
  const active=nav.querySelector('.cat-btn.active');
  if(active) setTimeout(()=>active.scrollIntoView({inline:'nearest',behavior:'smooth'}),100);
}

/* ════════════════════════════════════════════
   MANAGE PANEL
════════════════════════════════════════════ */
function buildManageGrid(){
  const grid=$('manage-grid');grid.innerHTML='';
  const hidden=new Set(prefs.hidden);
  ALL_CATS.forEach(c=>{
    const isPinned=prefs.pinned.includes(c.id);
    const chip=document.createElement('button');
    chip.className='mcat-chip'+(isPinned?' pinned':'');
    chip.dataset.cat=c.id;
    chip.title=isPinned?'In nav — tap to remove':'Not in nav — tap to add';
    chip.innerHTML=`<span class="chip-ico">${c.emoji}</span>${c.label}${isPinned?' ✓':''}`;

    chip.addEventListener('click',()=>{
      const idx=prefs.pinned.indexOf(c.id);
      if(idx>=0){
        if(prefs.pinned.length<=1){toast('Keep at least one category');return;}
        prefs.pinned.splice(idx,1);
        toast(`${c.label} removed from nav`);
        if(activeCat===c.id){
          const next=visibleCats().find(x=>x.id!==c.id)||visibleCats()[0];
          if(next){activeCat=next.id;loadCat(next.id);}
        }
      } else {
        prefs.pinned.push(c.id);
        toast(`${c.label} added to nav ✓`);
      }
      savePrefs(prefs);buildManageGrid();buildCatNav();
    });
    grid.appendChild(chip);
  });
}

$('btn-manage').addEventListener('click',()=>{
  const panel=$('manage-panel');
  const overlay=$('overlay');
  const isOpen=panel.classList.contains('open');
  if(!isOpen){buildManageGrid();panel.classList.add('open');overlay.classList.add('show');$('btn-manage').classList.add('active');}
  else{panel.classList.remove('open');overlay.classList.remove('show');$('btn-manage').classList.remove('active');}
});
$('overlay').addEventListener('click',()=>{
  $('manage-panel').classList.remove('open');
  $('bm-panel').classList.remove('open');
  $('overlay').classList.remove('show');
  $('btn-manage').classList.remove('active');
  $('btn-bookmarks').classList.remove('active');
});
$('btn-reset-cats').addEventListener('click',()=>{
  prefs.pinned=[...DEFAULT_PINNED];
  savePrefs(prefs);buildManageGrid();buildCatNav();toast('Reset to default ✓');
});

/* ════════════════════════════════════════════
   SEARCH
════════════════════════════════════════════ */
$('btn-search').addEventListener('click',()=>{
  const bar = $('search-bar');
  const isShow = bar.classList.contains('show');
  // close bookmarks if open
  $('bm-panel').classList.remove('open');
  $('overlay').classList.remove('show');
  $('btn-bookmarks').classList.remove('active');
  if(!isShow){
    bar.classList.add('show');
    $('btn-search').classList.add('active');
    setTimeout(()=>$('search-input').focus(),50);
  } else {
    bar.classList.remove('show');
    $('btn-search').classList.remove('active');
    searchQuery='';
    $('search-input').value='';
    renderFeed();
  }
});
$('search-input').addEventListener('input',e=>{
  searchQuery = e.target.value.trim();
  visCount = PG;
  renderFeed();
});
$('search-input').addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    $('search-bar').classList.remove('show');
    $('btn-search').classList.remove('active');
    searchQuery='';
    $('search-input').value='';
    renderFeed();
  }
});

/* ════════════════════════════════════════════
   BOOKMARKS
════════════════════════════════════════════ */
function renderBmPanel(){
  const list = $('bm-list');
  if(!bookmarks.length){
    list.innerHTML='<p class="bm-empty">No bookmarks yet.<br>Tap ☆ on any story to save it.</p>';
    return;
  }
  list.innerHTML='';
  bookmarks.forEach(b=>{
    const el=document.createElement('div');
    el.className='bm-item';
    el.innerHTML=`
      <div class="bm-item-title">${esc(b.title)}</div>
      <div class="bm-item-meta">
        <span class="bm-item-src">${esc(b.source)}</span>
        <span class="bm-item-time">${timeAgo(b.savedAt)||timeAgo(b.date)}</span>
      </div>
      <div class="bm-item-actions">
        <a class="bm-read" href="${esc(b.url)}" target="_blank" rel="noopener noreferrer">Read ↗</a>
        <button class="bm-remove" data-url="${esc(b.url)}">Remove</button>
      </div>`;
    el.querySelector('.bm-remove').addEventListener('click',()=>{
      bookmarks = bookmarks.filter(x=>x.url!==b.url);
      saveBookmarks(bookmarks);
      updateBmCount();
      renderBmPanel();
      // update star on any visible card
      document.querySelectorAll(`.bm-btn[data-url="${CSS.escape(b.url)}"]`).forEach(btn=>btn.classList.remove('saved'));
    });
    list.appendChild(el);
  });
}
$('btn-bookmarks').addEventListener('click',()=>{
  const panel = $('bm-panel');
  const isOpen = panel.classList.contains('open');
  // close search bar if open
  $('search-bar').classList.remove('show');
  $('btn-search').classList.remove('active');
  // close manage panel if open
  $('manage-panel').classList.remove('open');
  $('btn-manage').classList.remove('active');
  if(!isOpen){
    renderBmPanel();
    panel.classList.add('open');
    $('overlay').classList.add('show');
    $('btn-bookmarks').classList.add('active');
  } else {
    panel.classList.remove('open');
    $('overlay').classList.remove('show');
    $('btn-bookmarks').classList.remove('active');
  }
});
$('bm-clear-all').addEventListener('click',()=>{
  if(!bookmarks.length) return;
  if(!confirm('Clear all bookmarks?')) return;
  bookmarks=[];
  saveBookmarks(bookmarks);
  updateBmCount();
  renderBmPanel();
  document.querySelectorAll('.bm-btn.saved').forEach(b=>b.classList.remove('saved'));
  toast('Bookmarks cleared');
});

/* ════════════════════════════════════════════
   THEME
════════════════════════════════════════════ */
let theme=prefs.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  const svg=$('theme-svg');
  if(svg){
    svg.innerHTML = theme==='dark'
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  prefs.theme=theme;savePrefs(prefs);
}
applyTheme();
$('btn-theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme();});

/* ── refresh ── */
function refresh(){delete CACHE[activeCat];loadCat(activeCat,true);toast('Refreshing…');}
$('btn-refresh').addEventListener('click',refresh);

/* ── background prefetch first 4 visible cats after 10s ── */
setTimeout(()=>{
  visibleCats().filter(c=>c.id!==activeCat).slice(0,4).forEach((c,i)=>
    setTimeout(()=>loadCat(c.id),i*3500)
  );
},10000);

/* ── INIT ── */
buildCatNav();
updateBmCount();
loadCat(activeCat);
</script>
